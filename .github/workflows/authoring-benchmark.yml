name: Authoring Benchmark

# Runs the apps/benchmarks authoring cases against a pull request's eve package
# when a maintainer adds the `run-authoring-benchmark` label. Remove and re-add
# the label to benchmark a newer commit.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: authoring-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  benchmark:
    name: Authoring benchmark
    if: >-
      github.event.label.name == 'run-authoring-benchmark' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Each case can take up to EVE_BENCHMARK_TIMEOUT (15 minutes) plus sandbox
    # setup; the eve-pkg preview build can take several minutes to publish.
    timeout-minutes: 150
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BENCHMARK_MODEL: ${{ vars.EVE_BENCHMARK_MODEL || 'claude-sonnet-5' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @eve-internal/benchmarks...

      # The benchmark runner only accepts published canaries. The Vercel eve-pkg
      # preview deployment publishes the PR head by SHA, or skips when the PR
      # does not affect the eve package, in which case main's package applies.
      - name: Resolve the eve package
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://pkg.eve.dev/${HEAD_SHA}/eve.tgz"
          for _ in $(seq 1 60); do
            if curl -fsIL -o /dev/null "$url"; then
              echo "ref=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses" \
              --jq '[.[] | select(.context == "Vercel – eve-pkg")][0] | "\(.state) \(.description)"')
            case "$status" in
              "success Skipped"*)
                echo "This PR does not affect the eve package; benchmarking main's package."
                echo "ref=main" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failure* | error*)
                echo "::error::The Vercel – eve-pkg deployment failed: ${status}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::$url was not published within 30 minutes. Check the Vercel – eve-pkg deployment."
          exit 1

      - name: Run benchmark
        working-directory: apps/benchmarks
        env:
          CANARY_REF: ${{ steps.canary.outputs.ref }}
        run: pnpm benchmark --canary "$CANARY_REF" --model "$BENCHMARK_MODEL"

      - name: Summarize results
        if: ${{ !cancelled() }}
        working-directory: apps/benchmarks
        env:
          CANARY_REF: ${{ steps.canary.outputs.ref }}
        run: |
          {
            echo "### Authoring benchmark"
            echo
            echo "eve canary \`${CANARY_REF:0:12}\` with \`${BENCHMARK_MODEL}\`"
            echo
            echo "| Case | Passed | Pass rate |"
            echo "| --- | --- | --- |"
            for summary in results/current/*/*/summary.json; do
              [ -f "$summary" ] || continue
              case_id=$(basename "$(dirname "$summary")")
              jq -r --arg case "$case_id" \
                '"| \($case) | \(.passedRuns)/\(.totalRuns) | \(.passRate) |"' "$summary"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoring-benchmark-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: apps/benchmarks/results/
          if-no-files-found: ignore
          retention-days: 14
