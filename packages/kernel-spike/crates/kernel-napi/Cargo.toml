[package]
name = "kernel-napi"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
kernel = { path = "../kernel" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
