[workspace]
resolver = "2"
members = [
  "crates/kernel",
  "crates/runner",
  "crates/fx-mini",
  "crates/kernel-napi",
  "crates/kernel-wasm",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
